dataset:
  name: "CIFAR-10"
  data_dir: "./data"
  train_subset_ratio: 1.0
  num_classes: 10

training_pipeline:
  proxy_epochs: 5
  use_amp: true # activate mixed precision training for Nvidia GPUs
  early_stopping_loss: nan # stop the loss if it is nan

swarm_optimization:
  num_particles: 20
  num_iterations: 15
  safe_vram_margin_mb: 2000 # The safe VRAM margin is used to ensure that the GPU has enough memory to avoid fallbacks.

search_space:
  # continuous hyperparameters
  lr_log_bounds: [-4.0, -2.0]
  dropout_bounds: [0.0, 0.5]
  # discrete hyperparameters
  batch_size_choices: [32, 64, 128, 256]

baseline_hyperparameters:
  learning_rate: 0.001
  batch_size: 32
  dropout_rate: 0.5

swarm_algorithms:
  pso:
    inertial_weight: 0.7
    cognitive_weight: 2.0
    social_weight: 2.0
  dbo:
    prob_rolling: 0.2
    prob_brooding: 0.2
    prob_foraging: 0.4
    prob_stealing: 0.2
